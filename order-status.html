
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Status | LEVEL TOP UP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #0b0f19;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 440px;
      margin: 35px auto;
      padding: 24px;
      background: #111827;
      border: 1px solid #263449;
      border-radius: 16px;
    }
    h1 {
      color: #00e5ff;
      text-align: center;
      font-size: 25px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
    }
    label {
      display: block;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b0f19;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #00e5ff;
      color: #06111b;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
    .error { background: #3b1720; color: #ffb4c0; }
    .success { background: #123324; color: #a7f3c0; }
    .hidden { display: none; }
    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #00e5ff;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>LEVEL TOP UP</h1>
    <p style="text-align:center">Check Your Order Status</p>

    <form id="statusForm">
      <label for="orderId">Order ID</label>
      <input id="orderId" type="text"
        placeholder="যেমন: LT-123456789"
        required autocomplete="off">

      <label for="uid">Free Fire UID</label>
      <input id="uid" type="text"
        placeholder="তোমার Free Fire UID"
        required inputmode="numeric" autocomplete="off">

      <button id="checkBtn" type="submit">Check Order</button>
    </form>

    <div id="message" class="hidden"></div>
    <a class="back" href="index.html">← Back to Home</a>
  </main>

  <script>
    const SUPABASE_URL =
      "https://zdsbesearohgzaxtuggj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_5bGKfHKbmp7-Fbe0gdMLfg_e7VaSm8-";

    const form = document.getElementById("statusForm");
    const button = document.getElementById("checkBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.className = type;
      message.textContent = text;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const orderId = document.getElementById("orderId")
        .value.trim();
      const uid = document.getElementById("uid")
        .value.trim();

      if (!orderId || !uid) {
        showMessage("Order ID এবং UID দুটোই লিখো।", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Checking...";
      showMessage("অর্ডার খোঁজা হচ্ছে...", "success");

      try {
        const params = new URLSearchParams({
          select: "order_id,uid,player_name,package,price,amount,payment_method,status",
          order_id: "eq." + orderId,
          uid: "eq." + uid,
          limit: "1"
        });

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/orders?" + params.toString(),
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Accept": "application/json"
            }
          }
        );

        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error(
            "Supabase থেকে সঠিক JSON পাওয়া যায়নি। HTTP " +
            response.status
          );
        }

        if (!response.ok) {
          const detail = data.message || data.msg ||
            data.hint || data.details ||
            JSON.stringify(data);

          throw new Error(
            "HTTP " + response.status + ": " + detail
          );
        }

        if (!Array.isArray(data) || data.length === 0) {
          showMessage(
            "অর্ডার পাওয়া যায়নি। Order ID ও UID ঠিক আছে কি না দেখো।",
            "error"
          );
          return;
        }

        const order = data[0];
        message.className = "success";
        message.textContent = "";

        const heading = document.createElement("h3");
        heading.textContent = "Order Found ✓";
        message.appendChild(heading);

        const details = [
          ["Order ID", order.order_id],
          ["Player Name", order.player_name],
          ["Free Fire UID", order.uid],
          ["Package", order.package],
          ["Price", "৳" + (order.price ?? order.amount ?? "N/A")],
          ["Payment", order.payment_method],
          ["Status", order.status]
        ];

        details.forEach(function(item) {
          const row = document.createElement("p");
          row.textContent = item[0] + ": " +
            (item[1] ?? "N/A");
          message.appendChild(row);
        });

      } catch (error) {
        console.error("Order status error:", error);
        showMessage(
          "Error: " + (error.message || "Unknown error"),
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Check Order";
      }
    });
  </script>
</body>
</html>
